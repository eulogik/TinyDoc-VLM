<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TinyDoc — cited document extraction that runs locally</title>
  <desc id="desc">TinyDoc Engine 3.0: local receipt and invoice extraction with schema-validated JSON, OCR-span evidence, and field confidence. Receipt field F1 94.8 percent; pip install tinydoc.</desc>
  <rect width="1200" height="630" fill="#F4F6F2"/>
  <text x="80" y="72" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#1E6F5C">TinyDoc Engine 3.0 · v0.2.0</text>
  <text x="1120" y="72" text-anchor="end" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#7A898F">open source · Apache 2.0</text>
  <line x1="80" y1="96" x2="1120" y2="96" stroke="#C9D2CB"/>

  <text x="76" y="250" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="118" font-weight="600" fill="#0E1A24">TinyDoc</text>
  <text x="80" y="306" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#0E1A24">Cited document extraction</text>
  <text x="80" y="338" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#0E1A24">that runs on your machine.</text>
  <text x="80" y="378" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#4A5A64">Receipts and invoices become schema-valid JSON, exact evidence spans,</text>
  <text x="80" y="400" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#4A5A64">and per-field confidence. No cloud, no API keys.</text>

  <line x1="80" y1="444" x2="760" y2="444" stroke="#C9D2CB"/>
  <text x="80" y="478" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#7A898F">Receipt field F1</text>
  <text x="80" y="510" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" fill="#0E1A24">94.8%</text>
  <text x="240" y="478" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#7A898F">Schema valid</text>
  <text x="240" y="510" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" fill="#0E1A24">1.00</text>
  <text x="400" y="478" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#7A898F">Runs on</text>
  <text x="400" y="510" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" fill="#0E1A24">2B–3B</text>

  <text x="80" y="580" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#1E6F5C">pip install tinydoc</text>
  <text x="1120" y="580" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#4A5A64">github.com/eulogik/TinyDoc-VLM</text>

